<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://www.jma.go.jp; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'"><title>tenki · 松山の雨</title><link rel="stylesheet" href="./style.css"><body>
<main><header><p>気象庁 高解像度降水ナウキャスト</p><h1>松山の雨を確認</h1><p>代表地点 33.84°N / 132.77°E。表示対象は松山周辺の矩形範囲です。市境ではありません。</p></header>
<form id="controls"><label>緯度<input name="lat" type="number" min="33.65" max="34.05" step="any" value="33.84" required></label><label>経度<input name="lon" type="number" min="132.55" max="133" step="any" value="132.77" required></label><label>表示<select name="mode"><option value="analysis">解析</option><option value="forecast">予測</option></select></label><label>予測時間<select name="lead"><option value="0">0分</option><option value="5">5分</option><option value="10">10分</option><option value="15">15分</option><option value="20">20分</option><option value="25">25分</option><option value="30">30分</option><option value="35">35分</option><option value="40">40分</option><option value="45">45分</option><option value="50">50分</option><option value="55">55分</option><option value="60">60分</option></select></label><button>手動で更新</button></form>
<p id="status" role="status" aria-live="polite">未取得</p><section id="result" hidden><h2 id="bin"></h2><dl id="details"></dl><label>表示拡大（元画像 z10）<input id="zoom" type="range" min="10" max="14" value="10"></label><div class="viewport"><div id="tile"><img id="rain" alt="選択地点を含む気象庁の降水区分タイル"><span id="marker" aria-hidden="true">＋</span></div></div><p>背景地図なし・北が上。＋は選択地点。拡大は画像の引き伸ばしです。</p><a id="source" target="_blank" rel="noopener noreferrer">使用した気象庁 PNG</a></section>
<aside><h2>公式ページと比較</h2><a href="https://tenki.jp/radar/map/" target="_blank" rel="noopener noreferrer">tenki.jp 雨雲レーダー ↗</a> <a href="https://weather.yahoo.co.jp/weather/zoomradar/?pref=38" target="_blank" rel="noopener noreferrer">Yahoo!天気 愛媛県 ↗</a><p>各公式サイトを開く通常のリンクです。</p></aside>
<footer><p>出典：気象庁／本アプリで区分抽出・表示加工。<a href="https://www.jma.go.jp/jma/kishou/info/coment.html">気象庁の利用規約</a></p><p>透明は無降水を意味しません。未分類・不明色・欠測を降水量ゼロに変換しません。防災判断には気象庁の最新情報をご確認ください。</p></footer></main><script type="module" src="./app.js"></script></body></html>
